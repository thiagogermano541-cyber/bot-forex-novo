[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[project]
name = "jarvis-ai"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
 "fastapi>=0.115,<1", "uvicorn[standard]>=0.34,<1", "pydantic-settings>=2.8,<3",
 "sqlalchemy[asyncio]>=2.0,<3", "asyncpg>=0.30,<1", "redis>=5,<7",
 "httpx>=0.28,<1", "anthropic>=0.49,<1", "websockets>=15,<16",
 "PyJWT>=2.10,<3", "pwdlib[argon2]>=0.2,<1", "structlog>=25,<26"
]
[project.optional-dependencies]
test = ["pytest>=8,<9", "pytest-asyncio>=0.25,<1", "aiosqlite>=0.20,<1", "respx>=0.22,<1", "ruff>=0.11,<1"]
[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
[tool.ruff]
line-length = 110
[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]
